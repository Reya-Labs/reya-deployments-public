# Devnet passive perp feature flags: unpause + pausers, owner config grants,
# the tier-updater's dedicated fee-config signers, and the perpOB oracle push set.
# Excludes: FTM market pause, the OG-status bot, prog comp exchange
[invoke.passive_perp_unpause]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setFeatureFlagAllowAll"
args = ["<%= keccak256(hexlify('global')) %>", true]
depends = ["invoke.upgrade_passive_perp_proxy"]

[invoke.passive_perp_set_pausers]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setDeniers"
args = [
    "<%= keccak256(hexlify('global')) %>",
    [
        "<%= settings.pauser1 %>",
        "<%= settings.pauser2 %>",
        "<%= settings.pauser3 %>",
        "<%= settings.pauser4 %>",
    ],
]
depends = ["invoke.upgrade_passive_perp_proxy"]

[invoke.passive_perp_fee_config_system_owner]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = ["<%= keccak256(hexlify('configureFees')) %>", "<%= settings.owner %>"]
depends = ["invoke.upgrade_passive_perp_proxy"]

# Tier-updater service signers (updateTierId / updateReferralMapping). Same
# shape as passive_perp_fee_config_2/3 in the shared file, but with devnet's
# own EOAs: the shared file's settings resolve to the Cronos signers, which are
# the mainnet keys, and those must never be granted on this instance. See
# [var.fee_configuration_bots] in omnibus/reya_devnet.toml.
[invoke.passive_perp_fee_config_set_tier_id_bot]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('configureFees')) %>",
    "<%= settings.setTierIdBot %>",
]
depends = ["invoke.upgrade_passive_perp_proxy"]

[invoke.passive_perp_fee_config_set_referral_mapping_bot]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('configureFees')) %>",
    "<%= settings.setReferralMappingBot %>",
]
depends = ["invoke.upgrade_passive_perp_proxy"]

[invoke.passive_perp_market_config_system_owner]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = ["<%= keccak256(hexlify('configureMarket')) %>", "<%= settings.owner %>"]
depends = ["invoke.upgrade_passive_perp_proxy"]

# PassivePerp.setRiskBlockId is gated on `configureRiskBlock`, which is
# allowAll=false with an EMPTY allowlist on devnet AND on mainnet -- so the
# call reverts FeatureUnavailable for EVERY caller, owner included: the flag
# is checked before ownership. Market 1's risk-block step is cached in the
# deployment baseline and never re-runs, so nothing surfaced this until the
# mainnet market mirror added 74 more risk blocks and all 74 reverted.
#
# Same allowlist shape as the configureFees / configureMarket grants above.
# Deliberately NOT setFeatureFlagAllowAll: allowAll makes every allowlist
# assertion vacuously green, so the fork-suite pin would stop meaning anything.
[invoke.passive_perp_risk_block_config_system_owner]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('configureRiskBlock')) %>",
    "<%= settings.owner %>",
]
depends = ["invoke.upgrade_passive_perp_proxy"]

# PerpOB oracle push permissions
# - oraclePushers: msg.sender of pushOracleData (two relay bots)
# - oraclePublishers: EIP-712 signer (single = matching engine publisher)
[invoke.passive_perp_set_oracle_pusher1]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('oraclePushers')) %>",
    "<%= settings.oraclePusher1 %>",
]
depends = ["invoke.upgrade_passive_perp_proxy"]

[invoke.passive_perp_set_oracle_pusher2]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('oraclePushers')) %>",
    "<%= settings.oraclePusher2 %>",
]
depends = ["invoke.upgrade_passive_perp_proxy"]

[invoke.passive_perp_set_oracle_publisher_me]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('oraclePublishers')) %>",
    "<%= settings.matching_engine_publisher1 %>",
]
depends = ["invoke.upgrade_passive_perp_proxy"]

# PerpOB oracle pushers must also be on the multicall allowlist because
# pushOracleData is batched via PassivePerpProxy.tryAggregate, which checks
# the "multicall" feature flag against msg.sender before delegatecalling.
[invoke.passive_perp_set_multicall_oracle_pusher1]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('multicall')) %>",
    "<%= settings.oraclePusher1 %>",
]
depends = ["invoke.upgrade_passive_perp_proxy"]

[invoke.passive_perp_set_multicall_oracle_pusher2]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('multicall')) %>",
    "<%= settings.oraclePusher2 %>",
]
depends = ["invoke.upgrade_passive_perp_proxy"]
