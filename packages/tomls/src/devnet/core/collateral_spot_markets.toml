# Pair registration is required by Core auto-exchange event emission even when
# ordinary spot trading is closed. Mirror mainnet pairs for the nine collaterals
# missing from devnet; preserve the existing WETH and native sRUSD registrations.
# Only WBTC receives trading configuration and the spot trading feature flag.
# New raw IDs are captured from events, never copied from mainnet.

[var.devnet_collateral_spot_event_abi]
devnetCollateralSpotMarketAbi = "<%= JSON.stringify(contracts.CoreProxy.abi.concat({'type':'event','name':'SpotMarketInfoUpdated','inputs':[{'name':'eventSequenceNumber','type':'uint128','indexed':true,'internalType':'uint128'},{'name':'spotMarketId','type':'uint128','indexed':true,'internalType':'uint128'},{'name':'baseToken','type':'address','indexed':false,'internalType':'address'},{'name':'quoteToken','type':'address','indexed':false,'internalType':'address'},{'name':'symbol','type':'string','indexed':false,'internalType':'string'},{'name':'config','type':'tuple','indexed':false,'internalType':'struct SpotMarketConfig','components':[{'name':'oracleDeviation','type':'uint256','internalType':'UD60x18'},{'name':'minimumOrderBase','type':'uint256','internalType':'UD60x18'},{'name':'baseSpacing','type':'uint256','internalType':'UD60x18'},{'name':'priceSpacing','type':'uint256','internalType':'UD60x18'},{'name':'oracleNodeId','type':'bytes32','internalType':'bytes32'}]},{'name':'blockTimestamp','type':'uint256','indexed':false,'internalType':'uint256'}],'anonymous':false})) %>"

[var.devnet_wbtc_spot_config]
wbtcRusdSpot_oracleDeviationUnscaled = "0.05"
wbtcRusdSpot_minimumOrderBaseUnscaled = "0.0001"
wbtcRusdSpot_baseSpacingUnscaled = "0.0001"
wbtcRusdSpot_priceSpacingUnscaled = "0.01"
wbtcRusdSpot_oracleNodeId = "<%= settings.wbtcUsdcNodeIdStork %>"

[invoke.mirror_wbtc_rusd_create_spot_market]
target = ["CoreProxy"]
abi = "<%= settings.devnetCollateralSpotMarketAbi %>"
fromCall.func = "owner"
func = "createSpotMarket"
args = [
    "<%= settings.wbtcProxyAddress %>",
    "<%= settings.rusdProxyAddress %>",
    "WBTCRUSD",
]
var.wbtcRusdSpotMarketId.event = "SpotMarketInfoUpdated"
var.wbtcRusdSpotMarketId.arg = 1
# Serial creation makes rehearsal IDs deterministic; consumers must still use readback.
depends = [
    "invoke.wbtc_global_collateral_config",
    "invoke.rusd_global_collateral_config",
    "invoke.f_srusd_rusd_create_spot_market",
]

[invoke.mirror_wbtc_rusd_configure_spot_market]
target = ["CoreProxy"]
fromCall.func = "owner"
func = "setSpotMarketConfiguration"
args = [
    "<%= settings.wbtcRusdSpotMarketId %>",
    { oracleDeviation = "<%= parseEther(settings.wbtcRusdSpot_oracleDeviationUnscaled) %>", minimumOrderBase = "<%= parseEther(settings.wbtcRusdSpot_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.wbtcRusdSpot_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.wbtcRusdSpot_priceSpacingUnscaled) %>", oracleNodeId = "<%= settings.wbtcRusdSpot_oracleNodeId %>" },
]
depends = ["invoke.mirror_wbtc_rusd_create_spot_market"]

