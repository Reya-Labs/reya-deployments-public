# Devnet-only market 79 MSFT (perpOB). Same step sequence as the mirrored
# markets (see market_70paxg.toml): create on PassivePerp, open and guard the
# market's own collateral pool and market flag, configure, then merge into
# CP1. The market configuration is inline because no other environment
# registers this market. Parameters: [var.market_79msft] in the devnet omnibus.
#####################################
# Create Market
#####################################
[invoke.create_market_79msft]
target = ["PassivePerpProxy"]
abi = "<%= JSON.stringify(contracts.PassivePerpProxy.abi.concat({'type': 'event', 'name': 'MarketDataUpdatedV2', 'anonymous': false, 'inputs': [{'name': 'eventSequenceNumber', 'type': 'uint128', 'indexed': true, 'internalType': 'uint128'}, {'name': 'marketId', 'type': 'uint128', 'indexed': true, 'internalType': 'uint128'}, {'name': 'marketData', 'type': 'tuple', 'indexed': false, 'internalType': 'struct Market.Data', 'components': [{'name': 'id', 'type': 'uint128', 'internalType': 'uint128'}, {'name': 'passivePoolId_DEPRECATED', 'type': 'uint128', 'internalType': 'uint128'}, {'name': 'poolAccountId_DEPRECATED', 'type': 'uint128', 'internalType': 'uint128'}, {'name': 'quoteToken', 'type': 'address', 'internalType': 'address'}, {'name': 'quoteTokenDecimals', 'type': 'uint8', 'internalType': 'uint8'}, {'name': 'lastFundingVelocity_DEPRECATED', 'type': 'int256', 'internalType': 'SD59x18'}, {'name': 'lastFundingRate_DEPRECATED', 'type': 'int256', 'internalType': 'SD59x18'}, {'name': 'lastFundingTimestamp', 'type': 'uint256', 'internalType': 'uint256'}, {'name': 'lastMTM_DEPRECATED', 'type': 'tuple', 'internalType': 'struct PriceData', 'components': [{'name': 'price', 'type': 'uint256', 'internalType': 'UD60x18'}, {'name': 'timestamp', 'type': 'uint256', 'internalType': 'uint256'}]}, {'name': 'longTrackers', 'type': 'tuple', 'internalType': 'struct FundingAndADLTrackers', 'components': [{'name': 'fundingValue', 'type': 'int256', 'internalType': 'SD59x18'}, {'name': 'baseMultiplier', 'type': 'uint256', 'internalType': 'UD60x18'}, {'name': 'adlUnwindPrice', 'type': 'uint256', 'internalType': 'UD60x18'}]}, {'name': 'shortTrackers', 'type': 'tuple', 'internalType': 'struct FundingAndADLTrackers', 'components': [{'name': 'fundingValue', 'type': 'int256', 'internalType': 'SD59x18'}, {'name': 'baseMultiplier', 'type': 'uint256', 'internalType': 'UD60x18'}, {'name': 'adlUnwindPrice', 'type': 'uint256', 'internalType': 'UD60x18'}]}, {'name': 'openInterest', 'type': 'uint256', 'internalType': 'UD60x18'}, {'name': 'logPriceMultiplier_DEPRECATED', 'type': 'int256', 'internalType': 'SD59x18'}, {'name': 'depthFactor_DEPRECATED', 'type': 'uint256', 'internalType': 'UD60x18'}, {'name': 'priceSpread_DEPRECATED', 'type': 'uint256', 'internalType': 'UD60x18'}, {'name': 'velocityMultiplier_DEPRECATED', 'type': 'uint256', 'internalType': 'UD60x18'}, {'name': 'markPrice', 'type': 'uint256', 'internalType': 'UD60x18'}, {'name': 'markPriceTimestamp', 'type': 'uint256', 'internalType': 'uint256'}, {'name': 'fundingRate', 'type': 'int256', 'internalType': 'SD59x18'}, {'name': 'fundingRateTimestamp', 'type': 'uint256', 'internalType': 'uint256'}, {'name': 'lockedClosePrice', 'type': 'uint256', 'internalType': 'UD60x18'}]}, {'name': 'blockTimestamp', 'type': 'uint256', 'indexed': false, 'internalType': 'uint256'}]})) %>"
fromCall.func = "owner"
func = "createMarket"
args = ["Market MSFT", "<%= settings.rusdProxyAddress %>"]
var.market_79msft.event = "MarketDataUpdatedV2"
var.market_79msft.arg = 1
depends = [
    "invoke.core_register_instrument_passive_perp",
    "invoke.core_unpause",
    "invoke.passive_perp_global_config",
    "invoke.create_market_78aapl",
]

[var.market_79msft_vars]
market79MsftId = "<%= (String(settings.market_79msft) === '79') ? settings.market_79msft : parseUnits('0', 'assert market_79msft_vars failed') %>"
depends = ["invoke.create_market_79msft"]

##################################################
# Market's Collateral Pool Feature Flags
##################################################
[invoke.market_79msft_unpause_cp]
target = ["CoreProxy"]
fromCall.func = "getCollateralPoolOwner"
fromCall.args = ["<%= settings.market79MsftId %>"]
func = "setFeatureFlagAllowAll"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','uint128'],[keccak256(hexlify('collateralPoolEnabled')),settings.market79MsftId])) %>",
    true,
]
depends = ["invoke.upgrade_core_proxy", "var.market_79msft_vars"]

[invoke.market_79msft_set_pausers_cp]
target = ["CoreProxy"]
fromCall.func = "getCollateralPoolOwner"
fromCall.args = ["<%= settings.market79MsftId %>"]
func = "setDeniers"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','uint128'],[keccak256(hexlify('collateralPoolEnabled')),settings.market79MsftId])) %>",
    [
        "<%= settings.pauser1 %>",
        "<%= settings.pauser2 %>",
        "<%= settings.pauser3 %>",
        "<%= settings.pauser4 %>",
    ],
]
depends = ["invoke.upgrade_core_proxy", "var.market_79msft_vars"]

##################################################
# Market Feature Flags
##################################################
[invoke.market_79msft_unpause_market]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setFeatureFlagAllowAll"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','uint128'],[keccak256(hexlify('marketEnabled')),settings.market79MsftId])) %>",
    true,
]
depends = ["invoke.upgrade_core_proxy", "var.market_79msft_vars"]

[invoke.market_79msft_set_pausers_market]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setDeniers"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','uint128'],[keccak256(hexlify('marketEnabled')),settings.market79MsftId])) %>",
    [
        "<%= settings.pauser1 %>",
        "<%= settings.pauser2 %>",
        "<%= settings.pauser3 %>",
        "<%= settings.pauser4 %>",
    ],
]
depends = ["invoke.upgrade_core_proxy", "var.market_79msft_vars"]

#####################################
# Market Configuration
#####################################
[invoke.market_79msft_set_cp_limits]
target = ["CoreProxy"]
fromCall.func = "getCollateralPoolOwner"
fromCall.args = ["<%= settings.market79MsftId %>"]
func = "setCollateralPoolLimits"
args = [
    "<%= settings.market79MsftId %>",
    { maxMarkets = "1", maxCollaterals = "1" },
]
depends = ["invoke.create_market_79msft"]

##################################################
# Market's Collateral Pool Insurance Fund
#
# Required BEFORE the merge: CollateralPool.merge transfers the child's
# insurance fund into the parent's, and getInsuranceFundAccount is
# Account.exists(insuranceFundConfig().accountId) -- an unconfigured child
# reverts AccountNotFound("0"). (The reserved account needs no step: Core sets
# reservedAccountId when the pool is created.)
##################################################
[invoke.market_79msft_insurance_fund_config]
target = ["CoreProxy"]
fromCall.func = "getCollateralPoolOwner"
fromCall.args = ["<%= settings.market79MsftId %>"]
func = "configureCollateralPoolInsuranceFund"
args = [
    "<%= settings.market79MsftId %>",
    { accountId = "<%= settings.cp1Rusd_insuranceFundAccountId %>", liquidationFee = "<%= parseEther(settings.cp1Rusd_insuranceFund_liquidationFeeUnscaled) %>" },
]
depends = [
    "invoke.cp_1rusd_create_insurance_fund_account",
    "invoke.create_market_79msft",
]

#####################################
# Market Parameters
#####################################
[invoke.market_79msft_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market79MsftId %>",
    { riskMatrixIndex = "<%= settings.market79Msft_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market79Msft_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market79Msft_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market79Msft_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market79Msft_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market79Msft_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market79Msft_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market79Msft_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market79Msft_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market79Msft_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market79Msft_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market79Msft_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market79Msft_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market79Msft_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market79Msft_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market79Msft_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market79Msft_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market79Msft_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market79Msft_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market79Msft_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market79Msft_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market79Msft_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_79msft",
    "invoke.passive_perp_market_config_system_owner",
]

##################################################
# Merge Market's Collateral Pool into CP1
##################################################
[invoke.market_79msft_merge_collateral_pool]
target = ["CoreProxy"]
fromCall.func = "owner"
func = "mergeCollateralPools"
args = ["<%= settings.market1EthId %>", "<%= settings.market79MsftId %>"]
depends = [
    "invoke.market_1eth_set_cp_limits",
    "invoke.market_79msft_unpause_cp",
    "invoke.market_79msft_set_pausers_cp",
    "invoke.market_79msft_unpause_market",
    "invoke.market_79msft_set_pausers_market",
    "invoke.market_79msft_set_market_config",
    "invoke.market_79msft_set_cp_limits",
    "invoke.market_79msft_insurance_fund_config",
]
