# Direct USDC mark nodes for the staged mainnet RWA cohort; no USD conversion node.
[invoke.oracle_manager_register_node_xau_usdc_mark_stork]
target = ["OracleManagerProxy"]
fromCall.func = "owner"
func = "registerNode"
args = [
    "<%= settings.ORACLE_MANAGER_NODE_TYPE_STORK_OFFCHAIN_LOOKUP %>",
    "<%= defaultAbiCoder.encode(['address','string'], [contracts.OracleAdaptersProxy.address, settings.storkAssetPairIdXAUUSDC_MK]) %>",
    [
    ],
]
var.xauUsdcMarkNodeIdStork.event = "NodeRegistered"
var.xauUsdcMarkNodeIdStork.arg = 0
depends = ["invoke.upgrade_oracle_manager_proxy"]

[invoke.oracle_manager_xau_usdc_mark_stork_max_stale_duration]
target = ["OracleManagerProxy"]
fromCall.func = "owner"
func = "setMaxStaleDuration"
args = [
    "<%= settings.xauUsdcMarkNodeIdStork %>",
    "<%= settings.xauUsdcMarkMaxStaleDurationStork %>",
]
depends = ["invoke.oracle_manager_register_node_xau_usdc_mark_stork"]

