# Mainnet RWA settings: agreed rounded hybrid (5 min) tiers for all twelve markets
# (76-81 agreed 6 October 2026, 82-87 on 7 October). Standard tiers reuse existing entries.
# Changed risk inputs rerun the existing createRiskMatrix invokes; their events
# supply replacement block IDs to the existing setRiskBlockId invokes.
# The five-minute allowance applies to fast moves; ordinary volatility keeps two hours.
[var.mainnet_rwa_stork_usdc_direct]
storkAssetPairIdXAUUSDC_MK = "XAUUSDC_MK"
storkAssetPairIdXAGUSDC_MK = "XAGUSDC_MK"
storkAssetPairIdAAPLUSDC_MK = "AAPLUSDC_MK"
storkAssetPairIdMSFTUSDC_MK = "MSFTUSDC_MK"
storkAssetPairIdGOOGLUSDC_MK = "GOOGLUSDC_MK"
storkAssetPairIdAMZNUSDC_MK = "AMZNUSDC_MK"
storkAssetPairIdNVDAUSDC_MK = "NVDAUSDC_MK"
storkAssetPairIdMETAUSDC_MK = "METAUSDC_MK"
storkAssetPairIdTSLAUSDC_MK = "TSLAUSDC_MK"
storkAssetPairIdSPYUSDC_MK = "SPYUSDC_MK"
storkAssetPairIdQQQUSDC_MK = "QQQUSDC_MK"
storkAssetPairIdWTIUSDC_MK = "WTIUSDC_MK"
# Reference-node freshness matches mainnet crypto: 60 seconds, as for native marks.
# Closed underlying sessions do not relax the maximum age of a signed oracle update.
xauUsdcMarkMaxStaleDurationStork = "60"
xagUsdcMarkMaxStaleDurationStork = "60"
aaplUsdcMarkMaxStaleDurationStork = "60"
msftUsdcMarkMaxStaleDurationStork = "60"
googlUsdcMarkMaxStaleDurationStork = "60"
amznUsdcMarkMaxStaleDurationStork = "60"
nvdaUsdcMarkMaxStaleDurationStork = "60"
metaUsdcMarkMaxStaleDurationStork = "60"
tslaUsdcMarkMaxStaleDurationStork = "60"
spyUsdcMarkMaxStaleDurationStork = "60"
qqqUsdcMarkMaxStaleDurationStork = "60"
wtiUsdcMarkMaxStaleDurationStork = "60"

