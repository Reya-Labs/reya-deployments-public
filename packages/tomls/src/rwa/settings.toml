# Mainnet RWA settings: agreed rounded hybrid (5 min) tiers for markets 76-87
# (76-81 agreed 6 October 2026, 82-87 on 7 October). Equity batch three (88-94)
# copies the devnet 1.1.13 values (#571, executed 16 Oct 2026). Standard tiers reuse existing entries.
# Changed risk inputs rerun the existing createRiskMatrix invokes; their events
# supply replacement block IDs to the existing setRiskBlockId invokes.
# The five-minute allowance applies to fast moves; ordinary volatility keeps two hours.
[var.mainnet_rwa_stork_usdc_direct]
storkAssetPairIdXAUUSDC_MK = "XAUUSDC_MK"
storkAssetPairIdXAGUSDC_MK = "XAGUSDC_MK"
storkAssetPairIdAAPLUSDC_MK = "AAPLUSDC_MK"
storkAssetPairIdMSFTUSDC_MK = "MSFTUSDC_MK"
storkAssetPairIdGOOGLUSDC_MK = "GOOGLUSDC_MK"
