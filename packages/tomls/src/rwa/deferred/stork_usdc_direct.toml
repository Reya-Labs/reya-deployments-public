# Deferred markets 82-87. Include only after batch one is executed and published.
[invoke.oracle_manager_register_node_nvda_usdc_mark_stork]
target = ["OracleManagerProxy"]
fromCall.func = "owner"
func = "registerNode"
args = [
    "<%= settings.ORACLE_MANAGER_NODE_TYPE_STORK_OFFCHAIN_LOOKUP %>",
    "<%= defaultAbiCoder.encode(['address','string'], [contracts.OracleAdaptersProxy.address, settings.storkAssetPairIdNVDAUSDC_MK]) %>",
    [
    ],
]
var.nvdaUsdcMarkNodeIdStork.event = "NodeRegistered"
var.nvdaUsdcMarkNodeIdStork.arg = 0
depends = ["invoke.upgrade_oracle_manager_proxy"]

[invoke.oracle_manager_nvda_usdc_mark_stork_max_stale_duration]
target = ["OracleManagerProxy"]
fromCall.func = "owner"
func = "setMaxStaleDuration"
args = [
    "<%= settings.nvdaUsdcMarkNodeIdStork %>",
    "<%= settings.nvdaUsdcMarkMaxStaleDurationStork %>",
]
depends = ["invoke.oracle_manager_register_node_nvda_usdc_mark_stork"]

