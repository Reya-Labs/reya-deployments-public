# Separate 1x1 risk blocks; capture emitted IDs, do not assume block ID equals market ID.
[invoke.cp_1rusd_create_risk_matrix_market_76xau]
target = ["CoreProxy"]
abi = "<%= JSON.stringify(contracts.CoreProxy.abi.concat({'type':'event','name':'RiskMatrixCreation','inputs':[{'name':'collateralPoolId','type':'uint128','indexed':true,'internalType':'uint128'},{'name':'riskBlockId','type':'uint256','indexed':true,'internalType':'uint256'},{'name':'riskMatrix','type':'int64[][]','indexed':false,'internalType':'SD1x18[][]'},{'name':'blockTimestamp','type':'uint256','indexed':false,'internalType':'uint256'}],'anonymous':false})) %>"
fromCall.func = "getCollateralPoolOwner"
fromCall.args = ["<%= settings.cp1RusdId %>"]
func = "createRiskMatrix"
var.cp1RusdMarket76XauRiskBlockId.event = "RiskMatrixCreation"
var.cp1RusdMarket76XauRiskBlockId.arg = 1
args = [
    "<%= settings.cp1RusdId %>",
    [
        [
            "<%= parseEther(settings.cp1Rusd_market76Xau_riskMatrix00Unscaled) %>",
        ],
    ],
]
depends = [
    "var.cp_1rusd_vars",
    "invoke.market_76xau_merge_collateral_pool",
    "invoke.cp_1rusd_create_risk_matrix_market_75mega",
]

[invoke.cp_1rusd_set_risk_block_id_market_76xau]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setRiskBlockId"
args = [
    "<%= settings.market76XauId %>",
    "<%= settings.cp1RusdMarket76XauRiskBlockId %>",
    "<%= settings.market76Xau_riskMatrixIndex %>",
]
depends = [
    "invoke.cp_1rusd_create_risk_matrix_market_76xau",
    "invoke.passive_perp_risk_block_config_system_owner",
]

