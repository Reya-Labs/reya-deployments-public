# The receipt is a 1:1 claim on one sUSDe, so it is priced by the shared sUSDe/USDC node.
[invoke.cp_1rusd_set_rkeyrock_config]
target = ["CoreProxy"]
fromCall.func = "owner"
func = "setCollateralConfig"
args = [
    "<%= settings.cp1RusdId %>",
    "<%= settings.rkeyrockProxyAddress %>",
    { depositingEnabled = true, cap = "<%= parseUnits(settings.rkeyrockCap, parseInt(settings.rkeyrockTokenDecimals)) %>", withdrawalWindowSize_DEPRECATED = "0", withdrawalTvlPercentageLimit_DEPRECATED = "0", autoExchangeThreshold = "<%= parseUnits(settings.rkeyrockAutoExchangeThreshold, parseInt(settings.rkeyrockTokenDecimals)) %>", autoExchangeInsuranceFee = "<%= parseEther(settings.rkeyrockAutoExchangeInsuranceFee) %>", autoExchangeDustThreshold = "<%= parseUnits(settings.rkeyrockAutoExchangeDustThreshold, parseInt(settings.rkeyrockTokenDecimals)) %>", bidSubmissionFee = "<%= parseUnits(settings.rkeyrockBidSubmissionFee, parseInt(settings.rkeyrockTokenDecimals)) %>" },
    { collateralAddress = "<%= settings.receiptQuoteToken %>", priceHaircut = "<%= parseEther(settings.rkeyrockPriceHaircut) %>", autoExchangeDiscount = "<%= parseEther(settings.rkeyrockAutoExchangeDiscount) %>", oracleNodeId = "<%= settings.susdeUsdcNodeIdStork %>" },
]
depends = [
    "var.cp_1rusd_vars",
    "invoke.cp_1rusd_set_rusd_config",
    "invoke.rkeyrock_global_collateral_config",
    "invoke.core_configure_protocol",
    "invoke.market_1eth_set_cp_limits",
    "var.receipt_token_addresses",
    "invoke.oracle_manager_susde_usdc_stork_max_stale_duration",
]
