[invoke.passive_perp_global_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setGlobalConfiguration"
args = [
    { coreProxy = "<%= contracts.CoreProxy.address %>", exchangeProxy_DEPRECATED = "<%= settings.perpExchangeTombstone %>", oracleManagerAddress_DEPRECATED = "<%= settings.perpOracleManagerTombstone %>", maxAbsFundingRate = "<%= parseEther(settings.maxAbsFundingRateUnscaled) %>", dustAccountId_DEPRECATED = "0" },
]
depends = [
    "invoke.upgrade_passive_perp_proxy",
    "invoke.upgrade_oracle_manager_proxy",
]
