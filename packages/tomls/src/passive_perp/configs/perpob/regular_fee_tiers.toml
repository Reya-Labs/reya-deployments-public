# Devnet passive perp fees: regular tiers 0-6 and the global fee parameters
# (incl. the passive pool fee share). The AMM-era exchange rebate step was
# removed: fee model V3 on the perpOB router dropped exchange fee mechanics,
# setExchangeRebate no longer exists on the proxy, and the 0.2 it wrote on
# 1 May 2026 sits in a retired storage namespace nothing reads.
[invoke.passive_perp_set_tier0_parameters]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setFeeTierParameters"
args = [
    "0",
    { takerFee = "<%= parseEther(settings.takerFeeTier0Unscaled) %>", makerFee_DEPRECATED = "<%= parseEther(settings.makerFeeTier0Unscaled) %>", makerRebate_DEPRECATED = "<%= parseEther(settings.makerRebateTier0Unscaled) %>" },
]
depends = ["invoke.upgrade_passive_perp_proxy"]

[invoke.passive_perp_set_tier1_parameters]
