# Fee model V3 struct, as the perpOB passive-perp router (1.1.x) exposes it.
# setGlobalFeeParameters writes the FULL struct, so every field is supplied:
# the six rates map the existing settings onto the renamed V3 fields (values
# unchanged on devnet; the previous AMM-era step wrote the same numbers under
# the old names), and the two tail fields are the passive pool fee share --
# the share of the taker fee net of the taker and referrer rebates credited to the
# pool's Core account. Devnet had never set them (poolAccountId 0 disables
# the share), so no fee ever reached the pool. The rebate value is a devnet
# placeholder; see pool1RusdRebateUnscaled in the omnibus. The old router's
# setPoolRebate/setExchangeRebate no longer exist on this proxy.
