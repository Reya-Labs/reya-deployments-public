# Mainnet AMM permission cleanup is deferred to PRO-1136 after native acceptance.
include = ["../oracle_manager/configs/constants/zero.toml"]

[invoke.passive_perp_pause_migration]
target = ["<%= settings.passivePerpProxy %>"]
abi = "<%= JSON.stringify(imports.reyaPassivePerpRouter.contracts.FeatureFlagModule.abi) %>"
from = "<%= settings.owner %>"
func = "setFeatureFlagAllowAll"
args = ["<%= keccak256(hexlify('global')) %>", false]
depends = ["var.upgrade_proxy_vars", "clone.reyaPassivePerpRouter"]

[var.zero_price_oracle_manager]
zeroPriceOracleManager = "<%= settings.oracleManagerProxy %>"
depends = [
    "invoke.passive_perp_pause_migration",
    "invoke.upgrade_oracle_manager_proxy",
]

[invoke.upgrade_core_proxy]
depends = [
    "var.upgrade_proxy_vars",
    "clone.reyaCoreRouter",
    "invoke.passive_perp_pause_migration",
]

[invoke.upgrade_passive_perp_proxy]
depends = [
    "var.upgrade_proxy_vars",
    "clone.reyaPassivePerpRouter",
    "invoke.passive_perp_pause_migration",
]

[invoke.upgrade_orders_gateway_proxy]
depends = [
    "var.upgrade_proxy_vars",
    "clone.reyaOrdersGatewayRouter",
    "invoke.passive_perp_pause_migration",
]

[invoke.upgrade_periphery_proxy]
depends = [
    "var.upgrade_proxy_vars",
    "clone.reyaPeripheryRouter",
    "invoke.passive_perp_pause_migration",
]
