# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_22kbonk_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market22KBonkId %>",
    { riskMatrixIndex = "<%= settings.market22KBonk_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market22KBonk_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market22KBonk_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market22KBonk_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market22KBonk_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market22KBonk_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market22KBonk_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market22KBonk_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market22KBonk_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market22KBonk_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market22KBonk_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market22KBonk_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market22KBonk_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market22KBonk_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market22KBonk_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market22KBonk_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market22KBonk_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market22KBonk_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market22KBonk_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market22KBonk_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market22KBonk_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market22KBonk_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_22kbonk",
    "invoke.passive_perp_market_config_system_owner",
]
