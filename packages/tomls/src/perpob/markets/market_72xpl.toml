# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_72xpl_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market72XplId %>",
    { riskMatrixIndex = "<%= settings.market72Xpl_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market72Xpl_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market72Xpl_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market72Xpl_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market72Xpl_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market72Xpl_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market72Xpl_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market72Xpl_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market72Xpl_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market72Xpl_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market72Xpl_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market72Xpl_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market72Xpl_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market72Xpl_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market72Xpl_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market72Xpl_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market72Xpl_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market72Xpl_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market72Xpl_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market72Xpl_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market72Xpl_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market72Xpl_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_72xpl",
    "invoke.passive_perp_market_config_system_owner",
]
