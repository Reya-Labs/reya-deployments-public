# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_28pol_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market28PolId %>",
    { riskMatrixIndex = "<%= settings.market28Pol_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market28Pol_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market28Pol_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market28Pol_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market28Pol_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market28Pol_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market28Pol_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market28Pol_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market28Pol_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market28Pol_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market28Pol_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market28Pol_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market28Pol_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market28Pol_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market28Pol_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market28Pol_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market28Pol_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market28Pol_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market28Pol_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market28Pol_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market28Pol_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market28Pol_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_28pol",
    "invoke.passive_perp_market_config_system_owner",
]
