# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_41pengu_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market41PenguId %>",
    { riskMatrixIndex = "<%= settings.market41Pengu_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market41Pengu_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market41Pengu_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market41Pengu_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market41Pengu_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market41Pengu_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market41Pengu_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market41Pengu_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market41Pengu_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market41Pengu_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market41Pengu_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market41Pengu_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market41Pengu_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market41Pengu_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market41Pengu_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market41Pengu_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market41Pengu_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market41Pengu_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market41Pengu_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market41Pengu_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market41Pengu_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market41Pengu_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_41pengu",
    "invoke.passive_perp_market_config_system_owner",
]
