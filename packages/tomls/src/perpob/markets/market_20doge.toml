# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_20doge_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market20DogeId %>",
    { riskMatrixIndex = "<%= settings.market20Doge_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market20Doge_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market20Doge_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market20Doge_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market20Doge_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market20Doge_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market20Doge_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market20Doge_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market20Doge_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market20Doge_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market20Doge_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market20Doge_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market20Doge_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market20Doge_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market20Doge_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market20Doge_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market20Doge_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market20Doge_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market20Doge_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market20Doge_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market20Doge_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market20Doge_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_20doge",
    "invoke.passive_perp_market_config_system_owner",
]
