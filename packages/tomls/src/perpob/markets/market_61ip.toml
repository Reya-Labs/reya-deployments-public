# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_61ip_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market61IpId %>",
    { riskMatrixIndex = "<%= settings.market61Ip_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market61Ip_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market61Ip_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market61Ip_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market61Ip_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market61Ip_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market61Ip_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market61Ip_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market61Ip_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market61Ip_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market61Ip_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market61Ip_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market61Ip_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market61Ip_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market61Ip_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market61Ip_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market61Ip_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market61Ip_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market61Ip_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market61Ip_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market61Ip_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market61Ip_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_61ip",
    "invoke.passive_perp_market_config_system_owner",
]
