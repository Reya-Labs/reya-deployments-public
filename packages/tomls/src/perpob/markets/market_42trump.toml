# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_42trump_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market42TrumpId %>",
    { riskMatrixIndex = "<%= settings.market42Trump_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market42Trump_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market42Trump_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market42Trump_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market42Trump_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market42Trump_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market42Trump_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market42Trump_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market42Trump_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market42Trump_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market42Trump_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market42Trump_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market42Trump_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market42Trump_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market42Trump_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market42Trump_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market42Trump_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market42Trump_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market42Trump_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market42Trump_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market42Trump_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market42Trump_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_42trump",
    "invoke.passive_perp_market_config_system_owner",
]
