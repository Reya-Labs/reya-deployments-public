# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_35grass_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market35GrassId %>",
    { riskMatrixIndex = "<%= settings.market35Grass_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market35Grass_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market35Grass_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market35Grass_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market35Grass_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market35Grass_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market35Grass_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market35Grass_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market35Grass_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market35Grass_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market35Grass_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market35Grass_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market35Grass_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market35Grass_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market35Grass_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market35Grass_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market35Grass_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market35Grass_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market35Grass_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market35Grass_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market35Grass_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market35Grass_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_35grass",
    "invoke.passive_perp_market_config_system_owner",
]
