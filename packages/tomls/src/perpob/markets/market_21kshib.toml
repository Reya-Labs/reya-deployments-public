# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_21kshib_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market21KShibId %>",
    { riskMatrixIndex = "<%= settings.market21KShib_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market21KShib_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market21KShib_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market21KShib_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market21KShib_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market21KShib_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market21KShib_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market21KShib_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market21KShib_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market21KShib_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market21KShib_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market21KShib_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market21KShib_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market21KShib_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market21KShib_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market21KShib_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market21KShib_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market21KShib_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market21KShib_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market21KShib_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market21KShib_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market21KShib_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_21kshib",
    "invoke.passive_perp_market_config_system_owner",
]
