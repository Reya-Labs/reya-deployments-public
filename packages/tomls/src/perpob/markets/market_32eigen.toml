# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_32eigen_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market32EigenId %>",
    { riskMatrixIndex = "<%= settings.market32Eigen_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market32Eigen_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market32Eigen_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market32Eigen_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market32Eigen_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market32Eigen_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market32Eigen_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market32Eigen_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market32Eigen_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market32Eigen_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market32Eigen_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market32Eigen_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market32Eigen_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market32Eigen_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market32Eigen_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market32Eigen_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market32Eigen_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market32Eigen_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market32Eigen_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market32Eigen_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market32Eigen_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market32Eigen_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_32eigen",
    "invoke.passive_perp_market_config_system_owner",
]
