# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_17wif_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market17WifId %>",
    { riskMatrixIndex = "<%= settings.market17Wif_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market17Wif_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market17Wif_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market17Wif_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market17Wif_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market17Wif_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market17Wif_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market17Wif_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market17Wif_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market17Wif_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market17Wif_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market17Wif_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market17Wif_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market17Wif_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market17Wif_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market17Wif_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market17Wif_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market17Wif_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market17Wif_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market17Wif_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market17Wif_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market17Wif_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_17wif",
    "invoke.passive_perp_market_config_system_owner",
]
