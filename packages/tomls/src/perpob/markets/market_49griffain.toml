# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_49griffain_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market49GriffainId %>",
    { riskMatrixIndex = "<%= settings.market49Griffain_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market49Griffain_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market49Griffain_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market49Griffain_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market49Griffain_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market49Griffain_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market49Griffain_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market49Griffain_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market49Griffain_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market49Griffain_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market49Griffain_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market49Griffain_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market49Griffain_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market49Griffain_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market49Griffain_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market49Griffain_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market49Griffain_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market49Griffain_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market49Griffain_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market49Griffain_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market49Griffain_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market49Griffain_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_49griffain",
    "invoke.passive_perp_market_config_system_owner",
]
