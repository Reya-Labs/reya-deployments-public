# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_12sui_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market12SuiId %>",
    { riskMatrixIndex = "<%= settings.market12Sui_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market12Sui_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market12Sui_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market12Sui_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market12Sui_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market12Sui_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market12Sui_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market12Sui_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market12Sui_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market12Sui_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market12Sui_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market12Sui_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market12Sui_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market12Sui_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market12Sui_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market12Sui_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market12Sui_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market12Sui_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market12Sui_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market12Sui_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market12Sui_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market12Sui_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_12sui",
    "invoke.passive_perp_market_config_system_owner",
]
