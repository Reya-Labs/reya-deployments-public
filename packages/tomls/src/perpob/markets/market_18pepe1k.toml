# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_18pepe1k_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market18Pepe1kId %>",
    { riskMatrixIndex = "<%= settings.market18Pepe1k_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market18Pepe1k_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market18Pepe1k_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market18Pepe1k_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market18Pepe1k_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market18Pepe1k_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market18Pepe1k_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market18Pepe1k_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market18Pepe1k_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market18Pepe1k_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market18Pepe1k_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market18Pepe1k_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market18Pepe1k_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market18Pepe1k_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market18Pepe1k_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market18Pepe1k_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market18Pepe1k_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market18Pepe1k_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market18Pepe1k_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market18Pepe1k_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market18Pepe1k_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market18Pepe1k_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_18pepe1k",
    "invoke.passive_perp_market_config_system_owner",
]
