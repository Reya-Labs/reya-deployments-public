# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_1eth_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market1EthId %>",
    { riskMatrixIndex = "<%= settings.market1Eth_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market1Eth_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market1Eth_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market1Eth_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market1Eth_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market1Eth_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market1Eth_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market1Eth_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market1Eth_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market1Eth_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market1Eth_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market1Eth_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market1Eth_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market1Eth_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market1Eth_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market1Eth_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market1Eth_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market1Eth_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market1Eth_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market1Eth_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market1Eth_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market1Eth_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_1eth",
    "invoke.passive_perp_market_config_system_owner",
]
