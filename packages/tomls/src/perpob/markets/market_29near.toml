# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_29near_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market29NearId %>",
    { riskMatrixIndex = "<%= settings.market29Near_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market29Near_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market29Near_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market29Near_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market29Near_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market29Near_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market29Near_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market29Near_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market29Near_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market29Near_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market29Near_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market29Near_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market29Near_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market29Near_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market29Near_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market29Near_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market29Near_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market29Near_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market29Near_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market29Near_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market29Near_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market29Near_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_29near",
    "invoke.passive_perp_market_config_system_owner",
]
