# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_7mkr_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market7MkrId %>",
    { riskMatrixIndex = "<%= settings.market7Mkr_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market7Mkr_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market7Mkr_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market7Mkr_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market7Mkr_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market7Mkr_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market7Mkr_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market7Mkr_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market7Mkr_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market7Mkr_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market7Mkr_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market7Mkr_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market7Mkr_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market7Mkr_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market7Mkr_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market7Mkr_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market7Mkr_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market7Mkr_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market7Mkr_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market7Mkr_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market7Mkr_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market7Mkr_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_7mkr",
    "invoke.passive_perp_market_config_system_owner",
]
