# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_52ape_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market52ApeId %>",
    { riskMatrixIndex = "<%= settings.market52Ape_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market52Ape_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market52Ape_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market52Ape_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market52Ape_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market52Ape_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market52Ape_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market52Ape_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market52Ape_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market52Ape_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market52Ape_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market52Ape_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market52Ape_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market52Ape_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market52Ape_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market52Ape_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market52Ape_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market52Ape_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market52Ape_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market52Ape_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market52Ape_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market52Ape_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_52ape",
    "invoke.passive_perp_market_config_system_owner",
]
