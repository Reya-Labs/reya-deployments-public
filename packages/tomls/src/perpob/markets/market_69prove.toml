# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_69prove_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market69ProveId %>",
    { riskMatrixIndex = "<%= settings.market69Prove_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market69Prove_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market69Prove_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market69Prove_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market69Prove_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market69Prove_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market69Prove_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market69Prove_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market69Prove_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market69Prove_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market69Prove_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market69Prove_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market69Prove_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market69Prove_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market69Prove_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market69Prove_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market69Prove_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market69Prove_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market69Prove_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market69Prove_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market69Prove_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market69Prove_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_69prove",
    "invoke.passive_perp_market_config_system_owner",
]
