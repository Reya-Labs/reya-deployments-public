# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_36kneiro_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market36KNeiroId %>",
    { riskMatrixIndex = "<%= settings.market36KNeiro_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market36KNeiro_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market36KNeiro_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market36KNeiro_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market36KNeiro_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market36KNeiro_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market36KNeiro_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market36KNeiro_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market36KNeiro_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market36KNeiro_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market36KNeiro_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market36KNeiro_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market36KNeiro_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market36KNeiro_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market36KNeiro_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market36KNeiro_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market36KNeiro_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market36KNeiro_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market36KNeiro_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market36KNeiro_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market36KNeiro_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market36KNeiro_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_36kneiro",
    "invoke.passive_perp_market_config_system_owner",
]
