# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_48fartcoin_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market48FartcoinId %>",
    { riskMatrixIndex = "<%= settings.market48Fartcoin_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market48Fartcoin_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market48Fartcoin_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market48Fartcoin_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market48Fartcoin_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market48Fartcoin_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market48Fartcoin_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market48Fartcoin_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market48Fartcoin_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market48Fartcoin_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market48Fartcoin_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market48Fartcoin_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market48Fartcoin_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market48Fartcoin_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market48Fartcoin_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market48Fartcoin_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market48Fartcoin_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market48Fartcoin_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market48Fartcoin_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market48Fartcoin_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market48Fartcoin_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market48Fartcoin_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_48fartcoin",
    "invoke.passive_perp_market_config_system_owner",
]
