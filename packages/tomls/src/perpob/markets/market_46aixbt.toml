# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_46aixbt_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market46AixbtId %>",
    { riskMatrixIndex = "<%= settings.market46Aixbt_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market46Aixbt_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market46Aixbt_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market46Aixbt_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market46Aixbt_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market46Aixbt_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market46Aixbt_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market46Aixbt_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market46Aixbt_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market46Aixbt_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market46Aixbt_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market46Aixbt_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market46Aixbt_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market46Aixbt_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market46Aixbt_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market46Aixbt_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market46Aixbt_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market46Aixbt_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market46Aixbt_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market46Aixbt_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market46Aixbt_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market46Aixbt_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_46aixbt",
    "invoke.passive_perp_market_config_system_owner",
]
