# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_58bera_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market58BeraId %>",
    { riskMatrixIndex = "<%= settings.market58Bera_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market58Bera_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market58Bera_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market58Bera_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market58Bera_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market58Bera_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market58Bera_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market58Bera_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market58Bera_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market58Bera_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market58Bera_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market58Bera_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market58Bera_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market58Bera_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market58Bera_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market58Bera_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market58Bera_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market58Bera_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market58Bera_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market58Bera_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market58Bera_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market58Bera_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_58bera",
    "invoke.passive_perp_market_config_system_owner",
]
