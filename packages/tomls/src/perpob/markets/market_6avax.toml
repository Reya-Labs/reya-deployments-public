# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_6avax_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market6AvaxId %>",
    { riskMatrixIndex = "<%= settings.market6Avax_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market6Avax_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market6Avax_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market6Avax_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market6Avax_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market6Avax_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market6Avax_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market6Avax_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market6Avax_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market6Avax_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market6Avax_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market6Avax_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market6Avax_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market6Avax_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market6Avax_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market6Avax_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market6Avax_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market6Avax_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market6Avax_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market6Avax_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market6Avax_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market6Avax_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_6avax",
    "invoke.passive_perp_market_config_system_owner",
]
