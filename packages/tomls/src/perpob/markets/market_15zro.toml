# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_15zro_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market15ZroId %>",
    { riskMatrixIndex = "<%= settings.market15Zro_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market15Zro_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market15Zro_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market15Zro_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market15Zro_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market15Zro_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market15Zro_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market15Zro_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market15Zro_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market15Zro_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market15Zro_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market15Zro_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market15Zro_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market15Zro_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market15Zro_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market15Zro_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market15Zro_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market15Zro_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market15Zro_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market15Zro_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market15Zro_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market15Zro_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_15zro",
    "invoke.passive_perp_market_config_system_owner",
]
