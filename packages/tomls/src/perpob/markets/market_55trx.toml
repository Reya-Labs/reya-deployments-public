# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_55trx_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market55TrxId %>",
    { riskMatrixIndex = "<%= settings.market55Trx_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market55Trx_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market55Trx_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market55Trx_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market55Trx_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market55Trx_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market55Trx_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market55Trx_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market55Trx_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market55Trx_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market55Trx_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market55Trx_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market55Trx_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market55Trx_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market55Trx_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market55Trx_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market55Trx_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market55Trx_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market55Trx_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market55Trx_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market55Trx_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market55Trx_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_55trx",
    "invoke.passive_perp_market_config_system_owner",
]
