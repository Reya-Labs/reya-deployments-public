# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_19popcat_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market19PopcatId %>",
    { riskMatrixIndex = "<%= settings.market19Popcat_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market19Popcat_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market19Popcat_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market19Popcat_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market19Popcat_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market19Popcat_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market19Popcat_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market19Popcat_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market19Popcat_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market19Popcat_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market19Popcat_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market19Popcat_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market19Popcat_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market19Popcat_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market19Popcat_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market19Popcat_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market19Popcat_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market19Popcat_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market19Popcat_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market19Popcat_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market19Popcat_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market19Popcat_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_19popcat",
    "invoke.passive_perp_market_config_system_owner",
]
