# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_27ldo_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market27LdoId %>",
    { riskMatrixIndex = "<%= settings.market27Ldo_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market27Ldo_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market27Ldo_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market27Ldo_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market27Ldo_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market27Ldo_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market27Ldo_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market27Ldo_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market27Ldo_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market27Ldo_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market27Ldo_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market27Ldo_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market27Ldo_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market27Ldo_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market27Ldo_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market27Ldo_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market27Ldo_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market27Ldo_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market27Ldo_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market27Ldo_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market27Ldo_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market27Ldo_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_27ldo",
    "invoke.passive_perp_market_config_system_owner",
]
