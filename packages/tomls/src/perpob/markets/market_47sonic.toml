# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_47sonic_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market47SonicId %>",
    { riskMatrixIndex = "<%= settings.market47Sonic_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market47Sonic_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market47Sonic_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market47Sonic_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market47Sonic_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market47Sonic_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market47Sonic_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market47Sonic_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market47Sonic_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market47Sonic_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market47Sonic_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market47Sonic_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market47Sonic_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market47Sonic_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market47Sonic_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market47Sonic_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market47Sonic_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market47Sonic_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market47Sonic_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market47Sonic_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market47Sonic_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market47Sonic_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_47sonic",
    "invoke.passive_perp_market_config_system_owner",
]
