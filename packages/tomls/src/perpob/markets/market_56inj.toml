# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_56inj_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market56InjId %>",
    { riskMatrixIndex = "<%= settings.market56Inj_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market56Inj_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market56Inj_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market56Inj_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market56Inj_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market56Inj_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market56Inj_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market56Inj_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market56Inj_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market56Inj_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market56Inj_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market56Inj_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market56Inj_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market56Inj_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market56Inj_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market56Inj_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market56Inj_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market56Inj_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market56Inj_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market56Inj_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market56Inj_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market56Inj_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_56inj",
    "invoke.passive_perp_market_config_system_owner",
]
