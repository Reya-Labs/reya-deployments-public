# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_3sol_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market3SolId %>",
    { riskMatrixIndex = "<%= settings.market3Sol_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market3Sol_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market3Sol_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market3Sol_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market3Sol_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market3Sol_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market3Sol_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market3Sol_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market3Sol_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market3Sol_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market3Sol_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market3Sol_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market3Sol_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market3Sol_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market3Sol_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market3Sol_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market3Sol_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market3Sol_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market3Sol_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market3Sol_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market3Sol_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market3Sol_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_3sol",
    "invoke.passive_perp_market_config_system_owner",
]
