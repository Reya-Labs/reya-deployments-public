# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_65syrup_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market65SyrupId %>",
    { riskMatrixIndex = "<%= settings.market65Syrup_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market65Syrup_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market65Syrup_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market65Syrup_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market65Syrup_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market65Syrup_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market65Syrup_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market65Syrup_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market65Syrup_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market65Syrup_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market65Syrup_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market65Syrup_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market65Syrup_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market65Syrup_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market65Syrup_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market65Syrup_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market65Syrup_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market65Syrup_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market65Syrup_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market65Syrup_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market65Syrup_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market65Syrup_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_65syrup",
    "invoke.passive_perp_market_config_system_owner",
]
