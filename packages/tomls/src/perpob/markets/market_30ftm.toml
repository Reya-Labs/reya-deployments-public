# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_30ftm_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market30FtmId %>",
    { riskMatrixIndex = "<%= settings.market30Ftm_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market30Ftm_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market30Ftm_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market30Ftm_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market30Ftm_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market30Ftm_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market30Ftm_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market30Ftm_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market30Ftm_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market30Ftm_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market30Ftm_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market30Ftm_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market30Ftm_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market30Ftm_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market30Ftm_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market30Ftm_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market30Ftm_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market30Ftm_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market30Ftm_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market30Ftm_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market30Ftm_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market30Ftm_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_30ftm",
    "invoke.passive_perp_market_config_system_owner",
]
