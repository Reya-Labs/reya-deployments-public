# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_59layer_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market59LayerId %>",
    { riskMatrixIndex = "<%= settings.market59Layer_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market59Layer_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market59Layer_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market59Layer_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market59Layer_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market59Layer_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market59Layer_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market59Layer_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market59Layer_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market59Layer_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market59Layer_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market59Layer_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market59Layer_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market59Layer_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market59Layer_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market59Layer_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market59Layer_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market59Layer_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market59Layer_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market59Layer_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market59Layer_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market59Layer_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_59layer",
    "invoke.passive_perp_market_config_system_owner",
]
