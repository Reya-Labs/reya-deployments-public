# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_4arb_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market4ArbId %>",
    { riskMatrixIndex = "<%= settings.market4Arb_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market4Arb_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market4Arb_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market4Arb_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market4Arb_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market4Arb_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market4Arb_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market4Arb_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market4Arb_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market4Arb_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market4Arb_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market4Arb_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market4Arb_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market4Arb_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market4Arb_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market4Arb_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market4Arb_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market4Arb_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market4Arb_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market4Arb_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market4Arb_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market4Arb_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_4arb",
    "invoke.passive_perp_market_config_system_owner",
]
