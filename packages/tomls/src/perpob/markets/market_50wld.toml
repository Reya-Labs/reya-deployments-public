# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_50wld_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market50WldId %>",
    { riskMatrixIndex = "<%= settings.market50Wld_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market50Wld_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market50Wld_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market50Wld_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market50Wld_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market50Wld_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market50Wld_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market50Wld_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market50Wld_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market50Wld_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market50Wld_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market50Wld_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market50Wld_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market50Wld_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market50Wld_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market50Wld_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market50Wld_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market50Wld_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market50Wld_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market50Wld_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market50Wld_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market50Wld_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_50wld",
    "invoke.passive_perp_market_config_system_owner",
]
