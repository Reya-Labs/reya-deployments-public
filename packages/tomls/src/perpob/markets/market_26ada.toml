# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_26ada_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market26AdaId %>",
    { riskMatrixIndex = "<%= settings.market26Ada_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market26Ada_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market26Ada_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market26Ada_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market26Ada_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market26Ada_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market26Ada_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market26Ada_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market26Ada_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market26Ada_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market26Ada_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market26Ada_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market26Ada_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market26Ada_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market26Ada_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market26Ada_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market26Ada_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market26Ada_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market26Ada_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market26Ada_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market26Ada_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market26Ada_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_26ada",
    "invoke.passive_perp_market_config_system_owner",
]
