# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_14sei_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market14SeiId %>",
    { riskMatrixIndex = "<%= settings.market14Sei_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market14Sei_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market14Sei_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market14Sei_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market14Sei_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market14Sei_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market14Sei_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market14Sei_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market14Sei_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market14Sei_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market14Sei_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market14Sei_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market14Sei_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market14Sei_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market14Sei_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market14Sei_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market14Sei_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market14Sei_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market14Sei_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market14Sei_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market14Sei_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market14Sei_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_14sei",
    "invoke.passive_perp_market_config_system_owner",
]
