# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_38ltc_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market38LtcId %>",
    { riskMatrixIndex = "<%= settings.market38Ltc_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market38Ltc_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market38Ltc_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market38Ltc_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market38Ltc_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market38Ltc_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market38Ltc_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market38Ltc_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market38Ltc_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market38Ltc_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market38Ltc_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market38Ltc_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market38Ltc_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market38Ltc_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market38Ltc_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market38Ltc_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market38Ltc_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market38Ltc_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market38Ltc_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market38Ltc_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market38Ltc_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market38Ltc_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_38ltc",
    "invoke.passive_perp_market_config_system_owner",
]
