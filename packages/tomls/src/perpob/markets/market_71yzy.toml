# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_71yzy_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market71YzyId %>",
    { riskMatrixIndex = "<%= settings.market71Yzy_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market71Yzy_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market71Yzy_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market71Yzy_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market71Yzy_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market71Yzy_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market71Yzy_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market71Yzy_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market71Yzy_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market71Yzy_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market71Yzy_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market71Yzy_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market71Yzy_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market71Yzy_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market71Yzy_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market71Yzy_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market71Yzy_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market71Yzy_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market71Yzy_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market71Yzy_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market71Yzy_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market71Yzy_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_71yzy",
    "invoke.passive_perp_market_config_system_owner",
]
