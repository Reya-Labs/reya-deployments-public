# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_39pyth_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market39PythId %>",
    { riskMatrixIndex = "<%= settings.market39Pyth_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market39Pyth_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market39Pyth_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market39Pyth_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market39Pyth_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market39Pyth_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market39Pyth_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market39Pyth_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market39Pyth_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market39Pyth_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market39Pyth_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market39Pyth_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market39Pyth_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market39Pyth_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market39Pyth_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market39Pyth_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market39Pyth_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market39Pyth_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market39Pyth_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market39Pyth_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market39Pyth_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market39Pyth_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_39pyth",
    "invoke.passive_perp_market_config_system_owner",
]
