# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_63pump_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market63PumpId %>",
    { riskMatrixIndex = "<%= settings.market63Pump_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market63Pump_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market63Pump_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market63Pump_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market63Pump_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market63Pump_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market63Pump_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market63Pump_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market63Pump_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market63Pump_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market63Pump_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market63Pump_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market63Pump_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market63Pump_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market63Pump_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market63Pump_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market63Pump_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market63Pump_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market63Pump_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market63Pump_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market63Pump_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market63Pump_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_63pump",
    "invoke.passive_perp_market_config_system_owner",
]
