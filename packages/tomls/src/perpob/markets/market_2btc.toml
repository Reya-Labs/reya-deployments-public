# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_2btc_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market2BtcId %>",
    { riskMatrixIndex = "<%= settings.market2Btc_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market2Btc_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market2Btc_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market2Btc_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market2Btc_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market2Btc_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market2Btc_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market2Btc_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market2Btc_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market2Btc_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market2Btc_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market2Btc_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market2Btc_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market2Btc_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market2Btc_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market2Btc_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market2Btc_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market2Btc_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market2Btc_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market2Btc_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market2Btc_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market2Btc_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_2btc",
    "invoke.passive_perp_market_config_system_owner",
]
