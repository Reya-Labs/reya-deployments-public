# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_68zora_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market68ZoraId %>",
    { riskMatrixIndex = "<%= settings.market68Zora_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market68Zora_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market68Zora_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market68Zora_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market68Zora_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market68Zora_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market68Zora_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market68Zora_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market68Zora_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market68Zora_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market68Zora_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market68Zora_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market68Zora_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market68Zora_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market68Zora_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market68Zora_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market68Zora_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market68Zora_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market68Zora_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market68Zora_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market68Zora_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market68Zora_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_68zora",
    "invoke.passive_perp_market_config_system_owner",
]
