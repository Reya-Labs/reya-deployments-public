# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_75mega_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market75MegaId %>",
    { riskMatrixIndex = "<%= settings.market75Mega_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market75Mega_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market75Mega_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market75Mega_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market75Mega_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market75Mega_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market75Mega_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market75Mega_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market75Mega_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market75Mega_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market75Mega_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market75Mega_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market75Mega_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market75Mega_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market75Mega_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market75Mega_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market75Mega_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market75Mega_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market75Mega_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market75Mega_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market75Mega_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market75Mega_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_75mega",
    "invoke.passive_perp_market_config_system_owner",
]
