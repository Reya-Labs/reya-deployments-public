# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_33pendle_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market33PendleId %>",
    { riskMatrixIndex = "<%= settings.market33Pendle_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market33Pendle_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market33Pendle_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market33Pendle_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market33Pendle_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market33Pendle_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market33Pendle_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market33Pendle_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market33Pendle_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market33Pendle_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market33Pendle_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market33Pendle_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market33Pendle_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market33Pendle_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market33Pendle_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market33Pendle_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market33Pendle_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market33Pendle_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market33Pendle_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market33Pendle_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market33Pendle_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market33Pendle_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_33pendle",
    "invoke.passive_perp_market_config_system_owner",
]
