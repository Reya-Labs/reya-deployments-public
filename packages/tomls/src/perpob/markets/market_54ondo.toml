# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_54ondo_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market54OndoId %>",
    { riskMatrixIndex = "<%= settings.market54Ondo_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market54Ondo_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market54Ondo_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market54Ondo_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market54Ondo_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market54Ondo_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market54Ondo_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market54Ondo_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market54Ondo_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market54Ondo_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market54Ondo_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market54Ondo_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market54Ondo_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market54Ondo_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market54Ondo_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market54Ondo_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market54Ondo_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market54Ondo_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market54Ondo_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market54Ondo_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market54Ondo_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market54Ondo_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_54ondo",
    "invoke.passive_perp_market_config_system_owner",
]
