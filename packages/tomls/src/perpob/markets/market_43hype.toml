# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_43hype_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market43HypeId %>",
    { riskMatrixIndex = "<%= settings.market43Hype_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market43Hype_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market43Hype_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market43Hype_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market43Hype_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market43Hype_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market43Hype_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market43Hype_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market43Hype_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market43Hype_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market43Hype_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market43Hype_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market43Hype_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market43Hype_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market43Hype_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market43Hype_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market43Hype_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market43Hype_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market43Hype_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market43Hype_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market43Hype_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market43Hype_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_43hype",
    "invoke.passive_perp_market_config_system_owner",
]
