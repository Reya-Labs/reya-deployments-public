# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_73wlfi_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market73WlfiId %>",
    { riskMatrixIndex = "<%= settings.market73Wlfi_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market73Wlfi_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market73Wlfi_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market73Wlfi_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market73Wlfi_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market73Wlfi_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market73Wlfi_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market73Wlfi_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market73Wlfi_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market73Wlfi_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market73Wlfi_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market73Wlfi_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market73Wlfi_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market73Wlfi_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market73Wlfi_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market73Wlfi_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market73Wlfi_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market73Wlfi_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market73Wlfi_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market73Wlfi_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market73Wlfi_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market73Wlfi_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_73wlfi",
    "invoke.passive_perp_market_config_system_owner",
]
