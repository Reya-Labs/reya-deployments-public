# Native market configuration shared by mainnet, Cronos and devnet.
[invoke.market_25jto_set_market_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setMarketConfiguration"
args = [
    "<%= settings.market25JtoId %>",
    { riskMatrixIndex = "<%= settings.market25Jto_riskMatrixIndex %>", maxOpenBase = "<%= parseEther(settings.market25Jto_maxOpenBaseUnscaled) %>", velocityMultiplier_DEPRECATED = "<%= parseEther(settings.market25Jto_velocityMultiplierUnscaled) %>", oracleNodeId = "<%= settings.market25Jto_oracleNodeId %>", mtmWindow_DEPRECATED = "<%= settings.market25Jto_mtmWindow %>", dutchConfig = { lambda = "<%= parseEther(settings.market25Jto_dutchConfig_lambdaUnscaled) %>", minBase = "<%= parseEther(settings.market25Jto_dutchConfig_minBaseUnscaled) %>" }, slippageParams = { phi = "<%= parseEther(settings.market25Jto_slippageParams_phiUnscaled) %>", beta = "<%= parseEther(settings.market25Jto_slippageParams_betaUnscaled) %>" }, minimumOrderBase = "<%= parseEther(settings.market25Jto_minimumOrderBaseUnscaled) %>", baseSpacing = "<%= parseEther(settings.market25Jto_baseSpacingUnscaled) %>", priceSpacing = "<%= parseEther(settings.market25Jto_priceSpacingUnscaled) %>", depthFactor_DEPRECATED = "<%= parseEther(settings.market25Jto_depthFactorUnscaled) %>", maxExposureFactor_DEPRECATED = "<%= parseEther(settings.market25Jto_maxExposureFactorUnscaled) %>", maxPSlippage_DEPRECATED = "<%= parseEther(settings.market25Jto_maxPSlippageUnscaled) %>", markPriceMaxStaleDuration = "<%= settings.market25Jto_markPriceMaxStaleDuration %>", priceSpread_DEPRECATED = "<%= parseEther(settings.market25Jto_priceSpreadUnscaled) %>", volatilityIndexMultiplier_DEPRECATED = "<%= parseEther(settings.market25Jto_volatilityIndexMultiplierUnscaled) %>", fundingRateMaxStaleDuration = "<%= settings.market25Jto_fundingRateMaxStaleDuration %>", markPriceMaxDeviation = "<%= parseEther(settings.market25Jto_markPriceMaxDeviationUnscaled) %>", fillPriceMaxDeviation = "<%= parseEther(settings.market25Jto_fillPriceMaxDeviationUnscaled) %>", minFundingInterval = "<%= settings.market25Jto_minFundingInterval %>" },
]
depends = [
    "invoke.create_market_25jto",
    "invoke.passive_perp_market_config_system_owner",
]
